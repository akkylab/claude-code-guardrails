[project]
name = "claude-code-guardrails"
version = "0.1.0"
description = "Claude Codeの事故を、起きる前に機械で止めるフックの詰め合わせ"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

# 実行に外部の依存はありません。配る相手の環境を選ばないことを優先しています。
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# 既定で有効なのは59規則だけで、残る880以上はすべて任意です。設定を書かないまま
# 実行しても、構造の劣化やセキュリティの問題は一切検出されません。全部入れてから
# 要らないものを外す形にしています。
select = ["ALL"]

ignore = [
    # 日本語を書くための除外です。全角文字を紛らわしい文字として弾かれます。
    "RUF001", "RUF002", "RUF003",

    # docstringの書式のうち、英語を前提にしたものを外します。
    "D400", "D415",              # ピリオド・句読点で終える
    "D401", "D403", "D404",      # 命令形・先頭を大文字・Thisで始めない
    "D105",                      # 特殊メソッド。役割が名前で決まっています
    "D107",                      # __init__。クラス側のdocstringと重複します
    "D203", "D213",              # それぞれD211・D212と両立しません

    # 著作権表示を全ファイルへ求める規則です。LICENSEで足ります。
    "CPY001",

    # TODOの書式を細かく求める規則です。
    "TD001", "TD002", "TD003", "TD004", "TD005", "TD006", "TD007",
    "FIX001", "FIX002", "FIX003", "FIX004",

    # 例外へ文字列を直接渡すことを禁じる規則です。読みやすさを優先します。
    "TRY003", "EM101", "EM102",

    # 書式が競合するため、片方を外します。
    "COM819",                    # COM812と逆向きです
    "ISC001",                    # 1行の暗黙の文字列連結
]

[tool.ruff.lint.per-file-ignores]
# T201（printの使用）は、標準出力へ出すこと自体が仕事のファイルだけ外します。
# ライブラリに残ったデバッグ用のprintを見つけるための規則なので、下の2つには
# 当てはまりません。
#
#   hook_io.py … 標準エラーへ理由を書くことが、ハーネスとの約束そのものです。
#                 ここを消すと、止めた理由がClaude Codeへ伝わりません。
#   install.py … 利用者が対話で実行するコマンドです。画面へ出すのが仕事です。
"guardrails/hook_io.py" = ["T201"]
"install.py" = ["T201"]

# テストで外してよいかは「書き方を直せるか」で決めています。
# 下はいずれも、書き方では消せないものです。
"tests/**" = [
    "S101",                      # テストでassertを書くのは正当です
    "S105", "S106", "S107",      # テスト用の文字列をパスワードと誤判定します
    "S603",                      # フックをプロセスとして起動するのがテストの本体です
    "ARG001", "ARG005",          # pytestのfixtureは引数で受け取ることが実行そのものです
    "PLR2004",                   # 期待値はその場に直接書くほうが読めます
    "D101", "D102", "D103", "D104",  # テスト名そのものが説明になっています
    "INP001",                    # テストの置き場に__init__.pyを置きません
    "N801", "N802", "PLC2401",   # テスト名は日本語で書きます
]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
